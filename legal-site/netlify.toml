[build]
  publish = "."
  functions = "netlify/functions"

# HTTPS front door for RevenueCat → HTTP EC2 API
[[redirects]]
  from = "/api/webhooks/revenuecat"
  to = "/.netlify/functions/revenuecat-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms-and-conditions.html"
  status = 200
